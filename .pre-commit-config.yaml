repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright pallatom REST_APIs
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      # - id: enforce-einops
      #   name: enforce einops over raw tensor ops
      #   language: python
      #   types: [python]
      #   entry: python scripts/check_einops.py

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
