default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  ### Commit Message ###
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        stages: [pre-commit]

  ### Makefile ###
  - repo: https://github.com/mrtazz/checkmake.git
    rev: 0.2.2
    hooks:
      - id: checkmake
        name: "🐮 Makefile · Lint Makefile"
        stages: [pre-commit]

  ### YAML ###
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        name: "📄 yaml · Validate YAML files"
        stages: [pre-commit]

  ### Data & Config Validation ###
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.31.0
    hooks:
      - id: check-github-workflows
        name: "🐙 github-actions · Validate gh workflow files"
        args: ["--verbose"]
        stages: [pre-commit]
      - id: check-taskfile
        name: "✅ taskfile · Validate Task configuration"
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: basedpyright pallatom
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
        files: ^(pallatom)/

  - repo: local
    hooks:
      - id: xenon
        name: "xenon · Enforce cyclomatic complexity limits"
        entry: xenon --max-absolute B --max-modules A --max-average A pallatom
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pylint
        name: "pylint · Google-style lint"
        entry: pylint
        language: system
        types: [python]
        files: ^pallatom/
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: enforce-einops
        name: enforce einops over raw tensor ops
        language: system
        types: [python]
        entry: python scripts/check_einops.py
        stages: [pre-commit]

      - id: enforce-jaxtyping
        name: enforce jaxtyping tensor annotations
        entry: python scripts/check_jaxtyping.py
        language: system
        types: [python]
        stages: [pre-commit]

      - id: pydoclint
        name: "pydoclint · Google-style docstring linting"
        entry: pydoclint pallatom
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  ### Shell ###

