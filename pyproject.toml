[project]
name = "diffusion"
version = "0.1.0"
description = "PyTorch diffusion project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "wandb>=0.18.0",
    "pandas>=2.0.0",
    "py3Dmol>=2.0.0",
    "beartype>=0.18.0",
    "einops>=0.8.0",
    "jaxtyping>=0.2.0",
    "structlog>=24.0.0",
    "tqdm>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pallatom"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torch/torchvision/torchaudio on x86_64 (CUDA) are provided by the
# pytorch/pytorch base image — uv only manages them on aarch64 (CPU).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]

[dependency-groups]
docs = [
    "sphinx>=7.0",
    "sphinx-autoapi>=3.0",
    "autodoc-pydantic>=2.2",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=0.9",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "pyright>=1.1.409",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",   # pylint — semantic checks, forces dataclasses/objects
    "D",    # pydocstyle — Google docstring convention
    "N",    # pep8-naming — Google follows PEP8 naming
    "ANN",  # flake8-annotations — enforce type hints on public APIs
    "RET",  # flake8-return — return statement consistency
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "F722", "F821", "UP037", # jaxtyping shape strings are runtime-parsed, not forward refs
    "ANN101", "ANN102",      # self/cls don't need annotations
    "D107",                  # __init__ docstring — use class docstring instead
    "PLR2004",               # magic values - common in ML constants.
    "PLR0913",               # forces 5 arg or less for each function, not always a good idea
    "PLR0402",               # would eliminate standard import pattern torch.nn as nn
    "N812",                  # would eliminate standard import pattern torch.nn.functional as F
    "N817",                  # would eliminate standard import pattern DistributedDataParallel DDP
    "N802",                  # lowercase function names, not always best in ML code
    "N803",                  # lowercase argument names, not always best in ML code
    "N806",                  # lowercase variable names, not always best in ML code
]


[tool.ruff.lint.per-file-ignores]
"pallatom/tests/**/*.py" = ["ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"        # auto-ignores rules that conflict with Google style

[tool.ruff.lint.isort]
known-first-party = ["diffusion"]

[tool.pyright]
extraPaths = ["pallatom"]
typeCheckingMode = "basic"           # baseline: enables ~30 fundamental checks
reportInvalidTypeForm = "none" # allows shape strings for jaxtyping compatibility.
reportIndexIssue = "none" # allows complex pytorch tensor indexing patterns.
reportConstantRedefinition = "none" # come back to this
# "error" # Final enforcement — error if a Final variable is reassigned

# No Any
# reportUnknownVariableType = "warning" # does not play well with jaxtyping
# reportUnknownParameterType = "warning" # contamination from untyped libraries
# reportUnknownMemberType = "warning" # contamination from untyped libraries
reportUnnecessaryTypeIgnoreComment = "none" # come back to this
# "warning" # aren't ignoring type errors without a specific reason.

strictParameterNoneValue = "warning" # prevents accessing attributes that might not exist at runtime.
reportUninitializedInstanceVariable = "warning" # class attributes are initialized in __init__.
reportUnnecessaryCast = "warning" # enfirces pytorch cast() calls are actually doing work.

# Enforce variance safety (e.g., dict vs Mapping)
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"

# Ensures that if you use a generic like dict[], the inner types are also validated
# This is key for catching things like dict[str, Any] which bypasses variance checks
reportUnknownArgumentType = "none" #come back to this "warning"
reportUnknownLambdaType = "none" # come back to this "warning"

# Google Style / Strictness: prevent mixing positional and keyword-only args
# in ways that break covariance in callbacks.
reportCallInDefaultInitializer = "warning"

# Google style: all public APIs must be fully annotated.
# reportMissingParameterType = "warning" # let's come back to this one
# reportMissingTypeArgument = "warning" # let's come back to this one
# Google style: don't reach into private members from outside their class/module.
# reportPrivateUsage = "warning" # let's come back to this one
reportPrivateImportUsage = "none"   # let's come back to this one
reportAttributeAccessIssue = "none" # let's come back to this
reportArgumentType = "none" # let's come back to this
reportCallIssue = "none" # let's come back to this
reportUndefinedVariable = "none" # let's come back to this
reportUnboundVariable = "none" # let's come back to this
reportRedeclaration = "none" # let's come back to this
reportOptionalMemberAccess = "none" # let's come back to this
reportOptionalOperand = "none" # let's come back to this
reportOptionalSubscript = "none" # let's come back to this

[tool.pytest.ini_options]
testpaths = ["tests", "pallatom/tests"]
pythonpath = ["pallatom"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

