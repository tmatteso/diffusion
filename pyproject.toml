[project]
name = "diffusion"
version = "0.1.0"
description = "PyTorch diffusion project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "wandb>=0.18.0",
    "pandas>=2.0.0",
    "py3Dmol>=2.0.0",
    "beartype>=0.18.0",
    "einops>=0.8.0",
    "jaxtyping>=0.2.0",
    "structlog>=24.0.0",
    "tqdm>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pallatom"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torch/torchvision/torchaudio on x86_64 (CUDA) are provided by the
# pytorch/pytorch base image — uv only manages them on aarch64 (CPU).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]

[dependency-groups]
docs = [
    "sphinx>=7.0",
    "sphinx-autoapi>=3.0",
    "autodoc-pydantic>=2.2",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["diffusion"]

[tool.pyright]
reportInvalidTypeForm = "none"
reportIndexIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests", "pallatom/tests"]
pythonpath = ["pallatom"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

