[project]
name = "diffusion"
version = "0.1.0"
description = "PyTorch diffusion project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "torchaudio>=2.7.0",
    "wandb>=0.18.0",
    "pandas>=2.0.0",
    "py3Dmol>=2.0.0",
    "beartype>=0.18.0",
    "einops>=0.8.0",
    "jaxtyping>=0.2.0",
    "structlog>=24.0.0",
    "tqdm>=4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pallatom"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# torch/torchvision/torchaudio on x86_64 (CUDA) are provided by the
# pytorch/pytorch base image — uv only manages them on aarch64 (CPU).
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]
torchaudio = [
    { index = "pytorch-cpu", marker = "platform_machine == 'aarch64'" },
]

[dependency-groups]
docs = [
    "sphinx>=7.0",
    "sphinx-autoapi>=3.0",
    "autodoc-pydantic>=2.2",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-mermaid>=0.9",
]
dev = [
    "black>=24.0.0",
    "ruff>=0.15.15",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.0.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
    "jupyter>=1.0.0",
    "basedpyright>=1.39.6",
    "wemake-python-styleguide>=1.6.2",
    "flake8-pyproject>=1.2.3",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb", "REST_APIs/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "PL",   # pylint — semantic checks, forces dataclasses/objects
    "D",    # pydocstyle — Google docstring convention
    "N",    # pep8-naming — Google follows PEP8 naming
    "ANN",  # flake8-annotations — enforce type hints on public APIs
    "RET",  # flake8-return — return statement consistency
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "RUF",  # ruff-specific — RUF100 flags unused noqa comments
    "TRY",  # exception handling hygiene
    "PERF", # performance antipatterns in hot paths
    "PGH",  # pygrep-hooks — requires specific codes on type: ignore comments
    "FBT",  # boolean trap — prefer keyword-only args or enums over bare bool params
    "PT",   # pytest style — raises match=, one statement per raises block, parametrize format
    "ISC",  # implicit string concatenation — catches ("foo" "bar") copy-paste bugs
#    "PYI",  # flake8-pyi
    "C90",  # mccabe code complexity
    "NPY",  # numpy specific rules
    "FURB", # refurb
#    "PTH",  # flake8-use-pathlib
    "ASYNC",# flake8-async
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "SLF",  # flake8-self
    "FAST", # FastAPI
]
ignore = [
    "F722", "F821", "UP037", # jaxtyping shape strings are runtime-parsed, not forward refs
    "D107",                  # __init__ docstring — use class docstring instead
    "PLR2004",               # magic values — common in ML constants
    "PLR0913",               # forces 5 arg or less for each function, not always a good idea
    "PLR0402",               # would eliminate standard import pattern torch.nn as nn
    "N812",                  # would eliminate standard import pattern torch.nn.functional as F
    "N817",                  # would eliminate standard import pattern DistributedDataParallel DDP
    "N802",                  # lowercase function names, not always best in ML code
    "N803",                  # lowercase argument names, not always best in ML code
    "N806",                  # lowercase variable names, not always best in ML code
    "TRY003",                # long exception messages are fine in ML code
    "FBT003",                # boolean literals at call sites are unavoidable in ML code
]


[tool.ruff.lint.per-file-ignores]
"pallatom/tests/**/*.py" = ["ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"        # auto-ignores rules that conflict with Google style

[tool.ruff.lint.isort]
known-first-party = ["diffusion"]

[tool.basedpyright]
extraPaths = ["pallatom"]
pythonVersion = "3.10"
typeCheckingMode = "all"
exclude = ["**/*.ipynb", "pallatom/tests/*"] # ignore tests temporarily

enableBasedFeatures = true
reportInvalidTypeForm = "none" # allows shape strings for jaxtyping compatibility.
reportIndexIssue = "none" # allows complex pytorch tensor indexing patterns.
reportUnknownVariableType = "none" # does not play well with jaxtyping

# Google style: don't reach into private members from outside their class/module.
reportPrivateImportUsage = "none" # not sure I agree with this one

[tool.flake8]
#max-line-length = 100
# wemake-python-styleguide (WPS) — ML-friendly ignores
#extend-ignore = [
    # Single-letter and short names are idiomatic in ML (x, y, z, B, N, i, j)
#    "WPS110", "WPS111",
    # Upper-case names in class bodies are fine for ML constants (D_MODEL, N_HEADS)
#    "WPS115",
    # ML forward() passes routinely have many imports, locals, args, methods, expressions
#    "WPS201", "WPS210", "WPS211", "WPS212", "WPS213", "WPS214",
    # Deep nesting and many conditions are unavoidable in training loops
#   "WPS220", "WPS221", "WPS222",
    # einops patterns repeat string specs; f-strings are fine
#   "WPS226", "WPS305",
    # jaxtyping false positives
#   "F722",
    # Plain dataclasses don't need an explicit base class
#   "WPS306",
    # Magic numbers already waived in ruff (PLR2004)
#   "WPS432",
    # Nested imports are sometimes needed for optional heavy deps
#   "WPS433",
    # Nested classes are common (e.g. Config inside nn.Module)
#   "WPS431",
    # Line-length is enforced by black at 100; let black own this
#   "E501",
    # Walrus operator (:=) is fine in Python 3.10+
#   "WPS332",
#]

[tool.pytest.ini_options]
testpaths = ["pallatom/tests"]
pythonpath = ["pallatom"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


