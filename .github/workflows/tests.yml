name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (CPU torch)
        run: |
          uv sync --group dev \
            --index "pytorch-cpu=https://download.pytorch.org/whl/cpu" \
            --override-source torch=pytorch-cpu \
            --override-source torchvision=pytorch-cpu \
            --override-source torchaudio=pytorch-cpu

      - name: Run pytest
        run: uv run pytest
