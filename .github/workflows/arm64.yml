name: ARM64 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that PR's older run in this workflow,
# which is stale once the branch has moved. Pushes to main and manual runs
# get a group of their own (the run id), so every one of them completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-arm64:
    uses: ./.github/workflows/devcontainer-checks.yml
    with:
      runs-on: '["ubuntu-24.04-arm"]'
      devcontainer-config: .devcontainer/arm64/devcontainer.json
      image-name: devcontainer-arm64
      static-checks-cmd: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      stub-ssh-agent: true
      no-cache: true
