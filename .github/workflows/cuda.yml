name: CUDA CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that PR's older run in this workflow,
# which is stale once the branch has moved. Pushes to main and manual runs
# get a group of their own (the run id), so every one of them completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks-cuda:
    uses: ./.github/workflows/devcontainer-checks.yml
    with:
      runs-on: '["self-hosted", "cuda-gpu"]'
      devcontainer-config: .devcontainer/cuda/devcontainer.json
      image-name: devcontainer-cuda
      static-checks-cmd: uv run --no-sync basedpyright pallatom
      cleanup-stale-container: true
      build-run-cmd: |
        show-platform
        python3 -c "import torch; assert torch.cuda.is_available(), 'CUDA not available'"
