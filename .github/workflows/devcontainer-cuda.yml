name: Build CUDA Devcontainer

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/cuda/devcontainer.json"
      - "pyproject.toml"
      - "uv.lock"
      - "pallatom/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/devcontainer-cuda.yml"
  pull_request:
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/cuda/devcontainer.json"
      - "pyproject.toml"
      - "uv.lock"
      - "pallatom/**"
      - ".pre-commit-config.yaml"
      - ".github/workflows/devcontainer-cuda.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, cuda-gpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build CUDA devcontainer image
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cuda/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer-cuda
          push: never
          runCmd: |
            show-platform
            python3 -c "import torch; assert torch.cuda.is_available(), 'CUDA not available'"

  # --- Hooks that aren't versioned via pyproject.toml/uv.lock: run through
  # pre-commit itself (against the revs pinned in .pre-commit-config.yaml),
  # on the self-hosted runner between build and test as requested. ---
  checkmake:
    needs: build
    runs-on: [self-hosted, cuda-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run checkmake --all-files

  check-yaml:
    needs: build
    runs-on: [self-hosted, cuda-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run check-yaml --all-files

  check-github-workflows:
    needs: build
    runs-on: [self-hosted, cuda-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run check-github-workflows --all-files

  check-taskfile:
    needs: build
    runs-on: [self-hosted, cuda-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx pre-commit run check-taskfile --all-files

  test:
    needs: [checkmake, check-yaml, check-github-workflows, check-taskfile]
    runs-on: [self-hosted, cuda-gpu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run pytest in CUDA devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/cuda/devcontainer.json
          imageName: ghcr.io/${{ github.repository }}/devcontainer-cuda
          push: never
          runCmd: pytest -p no:cacheprovider pallatom
