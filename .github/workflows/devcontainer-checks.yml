name: Devcontainer Checks

# Reusable workflow: runs a caller-chosen static check command, then pytest,
# against a given devcontainer variant. arm64.yml runs the full pre-commit hook
# inventory once on a hosted runner; cuda.yml runs only basedpyright, whose
# result depends on the CUDA environment, so the single GPU runner stays free
# for tests.
on:
  workflow_call:
    inputs:
      runs-on:
        description: "JSON array of runner labels, e.g. '[\"ubuntu-24.04-arm\"]'"
        required: true
        type: string
      devcontainer-config:
        description: "Path to the devcontainer.json to build"
        required: true
        type: string
      image-name:
        description: "Image name suffix under ghcr.io/<repo>/"
        required: true
        type: string
      static-checks-cmd:
        description: "Command(s) to run inside the container before pytest"
        required: true
        type: string
      build-run-cmd:
        description: "Command(s) to verify the container before static checks"
        required: false
        type: string
        default: show-platform
      stub-ssh-agent:
        description: "Stub /run/host-services/ssh-auth.sock for plain dockerd runners"
        required: false
        type: boolean
        default: false
      no-cache:
        description: "Pass noCache through to devcontainers/ci"
        required: false
        type: boolean
        default: false
      cleanup-stale-container:
        description: "Remove leftover devcontainers and root-owned workspace files (persistent self-hosted runners)"
        required: false
        type: boolean
        default: false
      hide-gpus-from-pytest:
        description: "Run pytest with CUDA_VISIBLE_DEVICES empty, so tests never allocate GPU memory"
        required: false
        type: boolean
        default: false

jobs:
  static-checks:
    runs-on: ${{ fromJson(inputs.runs-on) }}
    steps:
      # The container runs as root and writes into the bind-mounted checkout.
      # On a persistent runner those files outlive the job, and checkout (as
      # the runner user) can't delete them. Hand them back before checkout.
      # Jobs from other runs can land on the runner between ours, so every
      # job does this, not just the first.
      - name: Reclaim root-owned workspace files
        if: inputs.cleanup-stale-container
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stub SSH agent socket for Docker Desktop mount
        if: inputs.stub-ssh-agent
        run: sudo mkdir -p /run/host-services && sudo touch /run/host-services/ssh-auth.sock

      - name: Remove stale devcontainer
        if: inputs.cleanup-stale-container
        run: |
          docker rm -f $(docker ps -aq --filter "label=devcontainer.local_folder=${{ github.workspace }}") 2>/dev/null || true

      - name: Run static checks in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: ${{ inputs.devcontainer-config }}
          imageName: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
          push: never
          noCache: ${{ inputs.no-cache }}
          runCmd: |
            set -e
            export PYTHONDONTWRITEBYTECODE=1
            git config --global --add safe.directory "$PWD"
            ${{ inputs.build-run-cmd }}
            ${{ inputs.static-checks-cmd }}

  test:
    needs: static-checks
    runs-on: ${{ fromJson(inputs.runs-on) }}
    steps:
      - name: Reclaim root-owned workspace files
        if: inputs.cleanup-stale-container
        run: |
          docker run --rm -v "${{ github.workspace }}:/w" alpine:3.20 \
            chown -R "$(id -u):$(id -g)" /w

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stub SSH agent socket for Docker Desktop mount
        if: inputs.stub-ssh-agent
        run: sudo mkdir -p /run/host-services && sudo touch /run/host-services/ssh-auth.sock

      - name: Run pytest in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: ${{ inputs.devcontainer-config }}
          imageName: ghcr.io/${{ github.repository }}/${{ inputs.image-name }}
          push: never
          noCache: ${{ inputs.no-cache }}
          # Keep pytest from writing into the bind-mounted checkout as root.
          # With hide-gpus-from-pytest, no test can open a CUDA context (the
          # DataLoader's pin-memory thread otherwise opens one on GPU 0), so
          # the suite cannot run out of memory next to a training job on the
          # same GPUs. No test needs a GPU; pinning becomes a no-op, as on
          # the ARM64 runner.
          runCmd: |
            export PYTHONDONTWRITEBYTECODE=1
            export HYPOTHESIS_STORAGE_DIRECTORY=/tmp/hypothesis
            if [ "${{ inputs.hide-gpus-from-pytest }}" = "true" ]; then
              export CUDA_VISIBLE_DEVICES=""
            fi
            pytest -p no:cacheprovider pallatom
